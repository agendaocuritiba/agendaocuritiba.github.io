name: Teste de acesso às fontes
on:
  push:
    branches: [claude/project-thread-bgc18o]
    paths: [scripts/probe_detalhe.py, scripts/collect.py, .github/workflows/probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/probe_detalhe.py
        continue-on-error: true
      - run: pip install requests beautifulsoup4 && python3 -u scripts/collect.py work/raw
      - uses: actions/upload-artifact@v4
        with:
          name: raw
          path: work/raw
