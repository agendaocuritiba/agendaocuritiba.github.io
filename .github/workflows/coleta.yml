name: Coleta diária
on:
  schedule:
    - cron: '17 9 * * *'   # 6h17 em Brasília (fora da hora cheia, quando o GitHub atrasa menos)
  workflow_dispatch:
    inputs:
      force:
        description: 'Coletar de novo mesmo se já houve coleta hoje'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: coleta
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q requests beautifulsoup4
      - run: scripts/daily.sh
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta
          path: work
          retention-days: 7
